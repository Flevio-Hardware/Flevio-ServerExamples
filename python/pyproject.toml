[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "flevio-server"
version = "1.0.0"
description = "Reference data server for the Flevio Compact Protocol (codec 0xF2), as spoken by FE-OT100 ELD trackers"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "First ELD" }]
keywords = ["eld", "telematics", "gps", "tracker", "j1939", "obd2", "fleet"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Communications",
    "Topic :: System :: Networking",
]
# Standard library only, deliberately: this is a file you copy into your own
# project as often as you install it.
dependencies = []

[project.urls]
Homepage = "https://firsteld.com"
Source = "https://github.com/Flevio-Hardware/Flevio-ServerExamples"

[tool.setuptools]
packages = ["flevio"]
